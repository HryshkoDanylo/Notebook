<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/user-style.css">
    <title>Профіль користувача</title>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon-actual');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '❌';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '👁️';
            }
        }
    </script>
</head>
<body>
<div class="page-wrapper">
    <div class="profile-container">
        <h2>Вітаємо, <span th:text="${user.username}">[username]</span>!</h2>

        <div class="form-group">
            <label for="password">Ваш пароль:</label>
            <div class="password-wrapper">
                <input type="password" id="password" th:value="${user.password}" readonly>
                <span id="eye-icon-actual" class="eye-icon" onclick="togglePassword()" title="Показати/сховати пароль">👁️</span>
            </div>
        </div>

        <div class="profile-links">
            <a href="/notes" class="profile-link notes-link">Перейти до нотаток</a>
            <a href="/logout" class="profile-link logout-link">Вийти</a>
        </div>
    </div>
</div>
</body>
</html>
